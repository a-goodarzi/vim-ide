schema_version: "1.1"
name: vscode-like-layout
expected_outcome: |
  A config exists in ./nvim-config with a left sidebar/activity bar offering explorer and project-wide search and replace (e.g. grug-far), tabs, a command palette binding (F1 or similar), and VS Code-style debug keys (F5/F9/F10/F11). Settings are toggleable from one place.
