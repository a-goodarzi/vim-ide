# ── Add to ~/.tmux.conf for the nvim IDE (then: tmux source-file ~/.tmux.conf) ──
set -sg escape-time 10                      # no lag on <Esc> (Vim modes, Claude Code interrupt)
set -g focus-events on                      # lets nvim reload files changed outside it
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"          # true color (tmux >= 3.2). Older tmux: set -ga terminal-overrides ",*:Tc"
set -g set-clipboard on                     # nvim yanks reach the system clipboard, also over ssh (OSC 52)
set -g allow-passthrough on                 # lets OSC sequences from nvim/Claude through (tmux >= 3.3)
set -g mouse on

# Seamless Ctrl-h/j/k/l between nvim splits and tmux panes (pairs with vim-tmux-navigator in the nvim config)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
